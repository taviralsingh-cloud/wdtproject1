<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Contact team</title>

<body>
    
    <h1>Contact us</h1>
    <p>We would love to hear from you</p>
    <nav>
        <a href="index.html">Home</a>
        <a href="collection.html"> Unique Collections</a>
        <a href="price.html">Prices</a>

    <h2>Customer Contact Form</h2>

<form>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your name" required>
    <br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email" required>
    <br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter phone number">
    <br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <label>Your Message:</label><br>
    <textarea rows="5" cols="30"
    placeholder="Write your message"></textarea>
    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>
<h2>
    If you want any specific design of your bandana then then send us message and if 
    available then add a pic of that design
</h2>
<form>
    <label>Your design</label>
    <input type="text" placeholder="enter your idea">
    <input type="image" placeholder="add image if available">
</form>

</body>
</html>
